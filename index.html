<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GZIpper | Compressão de Texto</title>
    <meta name="description" content="Codifique e decodifique texto usando GZIP + Base64, direto no navegador.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #d9c3a0;
            --paper-deep: #c9ae84;
            --sheet: #f3ead8;
            --ink: #1b1915;
            --ink-soft: #5a5246;
            --signal: #ff5a1f;
            --ok: #1f7a3a;
            --warn: #b0471b;
            --shadow: 6px 6px 0 var(--ink);
            --rule: rgba(27,25,21,.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #1d1b18;
                --paper-deep: #26231f;
                --sheet: #2c2924;
                --ink: #efe6d2;
                --ink-soft: #a89f8e;
                --signal: #ff6a33;
                --ok: #6fd18a;
                --warn: #ff9a6a;
                --rule: rgba(239,230,210,.08);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            color: var(--ink);
            background-color: var(--paper);
            /* Fibras do papel kraft */
            background-image:
                repeating-linear-gradient(90deg, transparent 0 3px, rgba(0,0,0,.025) 3px 4px),
                repeating-linear-gradient(0deg, transparent 0 7px, rgba(0,0,0,.02) 7px 8px);
            min-height: 100vh;
            padding: 0 0 48px;
        }

        .tape {
            height: 18px;
            background: repeating-linear-gradient(-45deg, var(--signal) 0 18px, var(--ink) 18px 36px);
            border-bottom: 2px solid var(--ink);
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 16px;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 24px;
            padding: 36px 0 24px;
            border-bottom: 2px solid var(--ink);
            margin-bottom: 32px;
        }

        h1 {
            font-family: 'Big Shoulders Stencil Display', Impact, sans-serif;
            font-weight: 900;
            font-size: clamp(3.5rem, 11vw, 7.5rem);
            line-height: .82;
            letter-spacing: .01em;
            text-transform: uppercase;
        }

        h1 .z { color: var(--signal); }

        .meta {
            font-size: .75rem;
            line-height: 1.7;
            text-transform: uppercase;
            letter-spacing: .08em;
            text-align: right;
            color: var(--ink-soft);
        }

        .meta strong { color: var(--ink); }

        .grid {
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            gap: 28px;
            align-items: stretch;
        }

        .slip {
            background: var(--sheet);
            border: 2px solid var(--ink);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .slip-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 2px solid var(--ink);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .slip-head label { cursor: pointer; }

        .slip-head .num {
            font-family: 'Big Shoulders Stencil Display', Impact, sans-serif;
            font-size: 1.6rem;
            line-height: 1;
            color: var(--signal);
        }

        textarea {
            flex: 1;
            width: 100%;
            min-height: 340px;
            border: 0;
            background:
                repeating-linear-gradient(transparent 0 25px, var(--rule) 25px 26px);
            background-position: 0 13px;
            color: var(--ink);
            font-family: inherit;
            font-size: 14px;
            line-height: 26px;
            padding: 13px 16px;
            resize: vertical;
            word-break: break-all;
        }

        textarea::placeholder { color: var(--ink-soft); opacity: .8; }
        textarea:focus { outline: 3px solid var(--signal); outline-offset: -3px; }

        .slip-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-top: 2px dashed var(--ink);
            font-size: .75rem;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: .06em;
            min-height: 46px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }

        .btn {
            font-family: inherit;
            font-size: .85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            padding: 14px 16px;
            border: 2px solid var(--ink);
            background: var(--sheet);
            color: var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
            transition: transform .08s, box-shadow .08s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
        .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
        .btn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
        .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--ink); }

        .btn-primary { background: var(--signal); color: #1b1915; }
        .btn-secondary { background: var(--ink); color: var(--sheet); }
        .btn-danger { background: transparent; border-style: dashed; box-shadow: none; }
        .btn-danger:hover { box-shadow: none; transform: none; background: var(--paper-deep); }
        .btn-danger:active { transform: none; }

        .btn-small { padding: 6px 12px; font-size: .72rem; box-shadow: 3px 3px 0 var(--ink); }
        .btn-dark { background: var(--sheet); }
        .btn-success { background: var(--ok); color: var(--sheet); }
        .btn-small.btn-danger { background: var(--warn); color: var(--sheet); border-style: solid; }

        .arrow { font-size: 1.1rem; line-height: 1; }

        .divider {
            border: 0;
            border-top: 2px dashed var(--ink);
            margin: 4px 0;
        }

        /* Esteira de carregamento */
        .loader-container { height: 14px; }
        .loader {
            height: 14px;
            border: 2px solid var(--ink);
            background: repeating-linear-gradient(-45deg, var(--signal) 0 8px, transparent 8px 16px);
            background-size: 22.6px 22.6px;
            animation: belt .6s linear infinite;
        }
        @keyframes belt { to { background-position: 22.6px 0; } }

        /* Manifesto de estatísticas */
        .stats-panel {
            margin-top: 40px;
            border: 2px solid var(--ink);
            background: var(--sheet);
            box-shadow: var(--shadow);
            transition: opacity .2s;
        }

        .stats-panel.hidden { opacity: .35; }
        .stats-panel.hidden .bar-fill { width: 0 !important; }

        .stats-row {
            display: grid;
            grid-template-columns: auto repeat(3, 1fr);
        }

        .stats-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Big Shoulders Stencil Display', Impact, sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            padding: 12px 10px;
            background: var(--ink);
            color: var(--sheet);
            text-align: center;
        }

        .stat-item {
            padding: 16px 18px;
            border-left: 2px solid var(--ink);
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .stat-label {
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--ink-soft);
        }

        .stat-value {
            font-family: 'Big Shoulders Stencil Display', Impact, sans-serif;
            font-weight: 900;
            font-size: 2rem;
            line-height: 1;
        }

        .bar {
            height: 18px;
            border-top: 2px solid var(--ink);
            background: repeating-linear-gradient(90deg, transparent 0 9px, var(--rule) 9px 10px);
        }

        .bar-fill {
            height: 100%;
            width: 0;
            background: var(--ink);
            transition: width .5s cubic-bezier(.2,.8,.2,1);
        }

        .d-none { display: none !important; }
        .text-success { color: var(--ok) !important; }
        .text-warning { color: var(--warn) !important; }

        footer {
            margin-top: 28px;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--ink-soft);
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .controls { flex-direction: row; flex-wrap: wrap; }
            .controls .btn { flex: 1 1 140px; }
            .divider { display: none; }
            .loader-container { flex-basis: 100%; }
            textarea { min-height: 220px; }
            .meta { text-align: left; }
        }

        @media (max-width: 560px) {
            .stats-row { grid-template-columns: 1fr; }
            .stats-title { writing-mode: horizontal-tb; transform: none; padding: 8px 14px; text-align: left; }
            .stat-item { border-left: 0; border-top: 2px solid var(--ink); flex-direction: row; justify-content: space-between; align-items: baseline; }
            .stat-value { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="tape" aria-hidden="true"></div>

<div class="wrap">
    <header>
        <h1>G<span class="z">Z</span>Ipper</h1>
        <div class="meta">
            <strong>Compressor de texto</strong><br>
            GZIP &rarr; Base64 &middot; UTF-8<br>
            Processado no seu navegador
        </div>
    </header>

    <main class="grid">
        <section class="slip">
            <div class="slip-head">
                <label for="inputText">Entrada</label>
                <span class="num">01</span>
            </div>
            <textarea id="inputText" spellcheck="false" placeholder="Cole o texto original ou a string Base64..."></textarea>
            <div class="slip-foot">
                <span id="charCount">0 caracteres</span>
                <span>UTF-8</span>
            </div>
        </section>

        <div class="controls">
            <button class="btn btn-primary" id="encodeBtn">Codificar <span class="arrow" aria-hidden="true">&rarr;</span></button>
            <button class="btn btn-secondary" id="decodeBtn">Decodificar <span class="arrow" aria-hidden="true">&larr;</span></button>
            <hr class="divider">
            <button class="btn btn-danger" id="clearBtn">Limpar <span class="arrow" aria-hidden="true">&times;</span></button>
            <div class="loader-container">
                <div id="loader" class="loader d-none" role="status" aria-label="Processando"></div>
            </div>
        </div>

        <section class="slip">
            <div class="slip-head">
                <label for="outputText">Saída</label>
                <span class="num">02</span>
            </div>
            <textarea id="outputText" readonly spellcheck="false" placeholder="O resultado aparece aqui."></textarea>
            <div class="slip-foot">
                <span>Somente leitura</span>
                <button class="btn btn-small btn-dark" id="copyBtn">Copiar</button>
            </div>
        </section>
    </main>

    <section id="statsPanel" class="stats-panel hidden" aria-live="polite">
        <div class="stats-row">
            <div class="stats-title">Manifesto</div>
            <div class="stat-item">
                <span class="stat-label">Original</span>
                <span class="stat-value" id="originalSize">&mdash;</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Comprimido</span>
                <span class="stat-value" id="compressedSize">&mdash;</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Eficiência</span>
                <span class="stat-value" id="ratio">&mdash;</span>
            </div>
        </div>
        <div class="bar" title="Tamanho comprimido em relação ao original">
            <div class="bar-fill" id="ratioBar"></div>
        </div>
    </section>

    <footer>Nada sai do seu computador &middot; GZIpper</footer>
</div>

<script src="index.js"></script>
</body>
</html>
